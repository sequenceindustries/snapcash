<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset password — snapcash</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<script src="analytics.js"></script>
</head>
<body>
<div class="nav">
  <div class="wrap nav-inner">
    <a class="logo" href="index.html"><img src="assets/logo.png" alt="snapcash" class="logo-img"></a>
    <nav class="nav-links"><a href="login.html">Login</a><a class="btn btn-blue" href="apply.html">Apply</a></nav>
  </div>
</div>
<main class="app-main">
  <p class="kicker">Account</p>
  <h1 style="font-size: clamp(28px,4vw,42px); margin-bottom: 6px;">Choose a new password.</h1>
  <p class="sub" style="margin-bottom: 26px;">You arrived here from the reset link in your email.</p>
  <div class="alert" id="msg"></div>
  <div class="form-card" style="max-width:none;">
    <div class="form-group"><label for="r-pass">New password</label><input id="r-pass" type="password" autocomplete="new-password" placeholder="At least 12 characters, with A-z, 0-9 and a symbol" /></div>
    <div class="form-group"><label for="r-pass2">Confirm new password</label><input id="r-pass2" type="password" autocomplete="new-password" /></div>
    <button class="btn btn-blue" style="width:100%;" id="btn-reset">Save new password</button>
  </div>
</main>
<script src="auth.js"></script>
<script>
(function () {
  var A = window.SnapAuth, msg = document.getElementById('msg');
  var token = new URLSearchParams(location.search).get('token');
  if (!token) A.err(msg, 'This page needs the link from your reset email. Request a new one from the login page.');

  document.getElementById('btn-reset').addEventListener('click', async function () {
    var p1 = document.getElementById('r-pass').value, p2 = document.getElementById('r-pass2').value;
    if (!A.passwordOk(A.passwordChecks(p1))) return A.err(msg, 'Use at least 12 characters with an uppercase and lowercase letter, a number and a symbol.');
    if (p1 !== p2) return A.err(msg, 'The two passwords don’t match.');
    var btn = this;
    btn.disabled = true; btn.classList.add('btn-loading');
    var r = await A.api('POST', '/api/auth/reset', { token: token, password: p1 });
    btn.disabled = false; btn.classList.remove('btn-loading');
    if (!r.ok) return A.err(msg, r.error);
    location.href = 'login.html?reset=1';
  });
})();
</script>
</body>
</html>
