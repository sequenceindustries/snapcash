<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signing you in — snapcash</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="app-main" style="text-align:center; padding-top:120px;">
  <p style="color:var(--muted); font-size:14px;">Signing you in…</p>
  <div class="alert" id="msg" style="margin-top:20px;"></div>
</main>

<script src="supabase-loader.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var A = window.SnapAuth, msg = document.getElementById('msg');
  if (A.showConfigWarning(msg)) return;
  var db = A.client;

  function otpErrorMessage() {
    return 'We couldn\u2019t complete Google sign-in. Please try again.';
  }

  async function run() {
    /* supabase-js v2 uses the PKCE flow for browser apps by default: Google
       redirects back here with a ?code=... query param, which must be
       exchanged for a session explicitly. If detectSessionInUrl already
       picked it up (implicit-flow fallback), getSession() below will
       simply return the session that's already there — either path is
       handled safely. */
    var code = new URLSearchParams(location.search).get('code');
    var oauthError = new URLSearchParams(location.search).get('error');

    if (oauthError) {
      A.err(msg, 'Google sign-in was cancelled or failed. Please try again, or use email and password instead.');
      setTimeout(function () { location.href = 'login.html'; }, 2200);
      return;
    }

    if (code) {
      var ex = await db.auth.exchangeCodeForSession(window.location.href);
      if (ex.error) {
        A.err(msg, otpErrorMessage());
        setTimeout(function () { location.href = 'login.html'; }, 2200);
        return;
      }
    }

    var s = await A.session();
    if (!s) {
      A.err(msg, otpErrorMessage());
      setTimeout(function () { location.href = 'login.html'; }, 2200);
      return;
    }

    /* From here it's identical to every other auth path: the central
       state machine decides whether this is a brand-new Google user who
       still needs phone enrolment, a returning one who needs the login
       challenge, or (never on a first Google sign-in) fully verified. */
    var st = await A.getAuthState();
    var dest = {
      awaiting_email_confirmation: 'login.html', /* Google emails are provider-confirmed; shouldn't normally land here */
      requires_phone_enrolment: 'verify-phone.html',
      requires_login_whatsapp_otp: 'verify-login.html',
      fully_verified: A.safeNextPage()
    }[st.state] || 'login.html';

    location.href = dest;
  }

  run();
})();
</script>
</body>
</html>
